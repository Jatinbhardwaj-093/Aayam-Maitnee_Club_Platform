openapi: 3.1.0
info:
  title: Cultural Club Operations Platform API (Aayam)
  description: |
    Backend API for Aayam - IIT BS Cultural & Drama Club Department Operations Platform.
    
    User stories covered in this specification (from Milestone 1):
    - US-MEM-001: Reviewing New Member Sign-ups (Club Secretary)
    - US-MEM-002: Discovery & Comprehensive Application (New Member)
    - US-MEM-003: Real-Time Application Tracking & Audition Scheduling (New Member)
    - US-SPA-001: Booking a Practice Room (Club Member)
    - US-SPA-002: Equipment Issue & Accountability Tracking (Club Administrator)
    - US-EVE-001: Personalized Schedule Feed (Club Member)
    - US-EVE-002: Standardized Event Proposals & Compliance Review (Event Organizer)
    - US-FIN-001: Financial Auditing & View-Only Ledgers (Regulatory Representative)
    - US-FIN-002: Digital Reimbursement Request Tracking (Club Member)
    - US-GOV-001: Annual Committee Account Role Handover (System Maintainer)
    - US-GOV-002: Confidential Misconduct Reporting Portal (Regulatory Representative)
    - US-SPO-001: Digital Sponsorship Proposal Submission (Advertiser / Sponsor)
    - US-SPO-002: Promotional Material & Media Asset Upload (Advertiser / Sponsor)
    - US-COL-001: External Collaboration Requests (External Club / Partner Organization)
    - US-COL-002: Institutional Workshop Request & Scheduling (Educational Institution)

    API Mapping Summary:
    - Authentication & Member Onboarding: /api/join, /api/login, /api/logout
    - Member Profile & Directory: /api/profile/*, /api/members, /api/labels/*
    - Events & Plays: /api/events/*, /api/plays/*, /api/open-positions
    - Rehearsals & Script Vault: /scripts, /rehearsal/*, /script/*, /api/scripts/*
    - Auditions & Stage Bookings: /api/audition-positions/*, /api/audition-applications/*, /api/my-auditions, /api/audition/submit, /api/stage-bookings
    - Proposals & Sponsorships: /api/proposals/*, /api/sponsor-ads/*
    - Media Gallery & Moderation: /api/gallery/*
    - Financials & Budget Governance: /api/financials/*, /api/revenue-metrics
    - User Schedule & Notifications: /api/my-schedule/*, /api/notifications/*
    - Maintainer & Dashboard Governance: /api/maintainer/*
    - System & Health: /api/health, /
  version: 1.0.0
  license:
    name: Proprietary
    url: https://aayam.iitm.ac.in/license
servers:
  - url: /
    description: Current API host
security:
  - BearerAuth: []
x-user-stories:
  - id: US-MEM-001
    actor: Club Secretary
    story: As a Club Secretary, I want to review incoming student applications online and approve them into active member status with one click, so that approved applicants automatically gain system access.
    api_mapping:
      - path: /api/join
        method: post
        operationId: join_club_api_join_post
      - path: /api/members
        method: get
        operationId: get_members_api_members_get
      - path: /api/users/{user_id}/labels
        method: post
        operationId: assign_user_label_api_users__user_id__labels_post
  - id: US-MEM-002
    actor: New Member
    story: As a New Member, I want to browse interest tracks, upload media portfolio samples, save application drafts, and submit forms online.
    api_mapping:
      - path: /api/join
        method: post
        operationId: join_club_api_join_post
      - path: /api/open-positions
        method: get
        operationId: get_open_positions_api_open_positions_get
      - path: /api/plays
        method: get
        operationId: get_plays_api_plays_get
  - id: US-MEM-003
    actor: New Member
    story: As a New Member, I want to track my application status on a visual dashboard and pick available audition time slots.
    api_mapping:
      - path: /api/my-auditions
        method: get
        operationId: get_my_auditions_api_my_auditions_get
      - path: /api/audition/submit
        method: post
        operationId: submit_audition_api_audition_submit_post
      - path: /api/audition-positions
        method: get
        operationId: get_audition_positions_api_audition_positions_get
  - id: US-SPA-001
    actor: Club Member
    story: As a regular Club Member, I want to select an open rehearsal space on the digital calendar and reserve a 1-hour slot up to 7 days in advance.
    api_mapping:
      - path: /api/stage-bookings
        method: get
        operationId: get_stage_bookings_api_stage_bookings_get
      - path: /api/stage-bookings
        method: post
        operationId: create_stage_booking_api_stage_bookings_post
  - id: US-SPA-002
    actor: Club Administrator
    story: As a Club Administrator, I want to digitally log stage equipment issued to and returned by members for each show.
    api_mapping:
      - path: /api/stage-bookings
        method: get
        operationId: get_stage_bookings_api_stage_bookings_get
      - path: /api/maintainer/dashboard
        method: get
        operationId: get_maintainer_dashboard_api_maintainer_dashboard_get
  - id: US-EVE-001
    actor: Club Member
    story: As a regular Club Member, I want to view a timeline on my personal dashboard showing only the rehearsals, call times, and duties assigned to me.
    api_mapping:
      - path: /api/my-schedule
        method: get
        operationId: get_my_schedule_api_my_schedule_get
      - path: /api/my-schedule/update
        method: post
        operationId: update_my_schedule_api_my_schedule_update_post
      - path: /api/notifications
        method: get
        operationId: get_notifications_api_notifications_get
      - path: /api/notifications/mark-read
        method: post
        operationId: mark_notifications_read_api_notifications_mark_read_post
  - id: US-EVE-002
    actor: Event Organizer
    story: As an Event Organizer, I want to submit event proposal forms with mandatory fields for venue, budget, and safety plans.
    api_mapping:
      - path: /api/proposals
        method: post
        operationId: create_proposal_api_proposals_post
      - path: /api/proposals/{prop_id}/approve
        method: post
        operationId: approve_proposal_api_proposals__prop_id__approve_post
      - path: /api/proposals/{prop_id}/reject
        method: post
        operationId: reject_proposal_api_proposals__prop_id__reject_post
      - path: /api/events/create
        method: post
        operationId: create_event_api_events_create_post
  - id: US-FIN-001
    actor: Regulatory Representative
    story: As a Regulatory Representative, I want to access digitized financial ledgers and receipt uploads for all past productions in view-only mode.
    api_mapping:
      - path: /api/financials
        method: get
        operationId: get_financials_api_financials_get
      - path: /api/financials/summary
        method: get
        operationId: get_financials_summary_api_financials_summary_get
      - path: /api/revenue-metrics
        method: get
        operationId: get_revenue_metrics_api_revenue_metrics_get
  - id: US-FIN-002
    actor: Club Member
    story: As a Club Member, I want to upload digital receipt images and track my expense reimbursement status online.
    api_mapping:
      - path: /api/revenue-metrics
        method: post
        operationId: create_revenue_metric_api_revenue_metrics_post
      - path: /api/financials
        method: get
        operationId: get_financials_api_financials_get
  - id: US-GOV-001
    actor: System Maintainer
    story: As a System Maintainer, I want to run a batch administrative utility at the end of the academic year to revert graduating leaders to general member status.
    api_mapping:
      - path: /api/maintainer/stats
        method: get
        operationId: get_maintainer_stats_api_maintainer_stats_get
      - path: /api/users/{user_id}/labels
        method: post
        operationId: assign_user_label_api_users__user_id__labels_post
      - path: /api/users/{user_id}/labels/{label_id}
        method: delete
        operationId: remove_user_label_api_users__user_id__labels__label_id__delete
  - id: US-GOV-002
    actor: Regulatory Representative
    story: As a Regulatory Representative, I want to provide a secure, sequestered portal where students can submit confidential safety or behavioral grievances.
    api_mapping:
      - path: /api/proposals
        method: post
        operationId: create_proposal_api_proposals_post
      - path: /api/notifications
        method: get
        operationId: get_notifications_api_notifications_get
  - id: US-SPO-001
    actor: Advertiser / Sponsor
    story: As an Advertiser / Sponsor, I want to review available sponsorship packages and submit partnership proposals online.
    api_mapping:
      - path: /api/sponsor-ads
        method: get
        operationId: get_sponsor_ads_api_sponsor_ads_get
      - path: /api/sponsor-ads/create
        method: post
        operationId: create_sponsor_ad_api_sponsor_ads_create_post
      - path: /api/sponsor-ads/{ad_id}/status
        method: post
        operationId: update_sponsor_ad_status_api_sponsor_ads__ad_id__status_post
  - id: US-SPO-002
    actor: Advertiser / Sponsor
    story: As an Advertiser / Sponsor, I want to upload high-resolution digital logos, banners, and prop integration guidelines into the platform.
    api_mapping:
      - path: /api/gallery
        method: get
        operationId: get_gallery_api_gallery_get
      - path: /api/gallery
        method: post
        operationId: upload_gallery_item_api_gallery_post
      - path: /api/gallery/{item_id}/status
        method: post
        operationId: update_gallery_item_status_api_gallery__item_id__status_post
      - path: /api/gallery/{item_id}
        method: delete
        operationId: delete_gallery_item_api_gallery__item_id__delete
  - id: US-COL-001
    actor: External Club / Partner Organization
    story: As an External Club / Partner Organization, I want to submit joint performance proposals online and receive a unique tracking ID.
    api_mapping:
      - path: /api/proposals
        method: post
        operationId: create_proposal_api_proposals_post
      - path: /api/proposals/{prop_id}/update
        method: post
        operationId: update_proposal_api_proposals__prop_id__update_post
  - id: US-COL-002
    actor: Educational Institution
    story: As an Educational Institution, I want to request drama workshops by specifying preferred dates, target audience size, and venue details.
    api_mapping:
      - path: /api/events
        method: get
        operationId: get_events_api_events_get
      - path: /api/events/create
        method: post
        operationId: create_event_api_events_create_post
      - path: /api/events/{event_id}/update
        method: post
        operationId: update_event_api_events__event_id__update_post

x-api-mapping:
  Authentication:
    - post /api/join
    - post /api/login
    - post /api/logout
  User Profile & Directory:
    - get /api/profile/get
    - post /api/profile/update
    - get /api/members
    - get /api/labels
    - post /api/labels
    - post /api/users/{user_id}/labels
    - delete /api/users/{user_id}/labels/{label_id}
  Events & Plays:
    - get /api/events
    - post /api/events/create
    - post /api/events/{event_id}/update
    - get /api/plays
    - get /api/plays/{play_id}
    - get /api/open-positions
  Rehearsals & Scripts:
    - get /scripts
    - post /scripts
    - post /rehearsal/start
    - post /script/pin
    - get /api/scripts
    - post /api/scripts
    - get /api/scripts/{script_id}/download
    - put /api/scripts/{script_id}
    - post /api/scripts/{script_id}
    - delete /api/scripts/{script_id}
    - post /api/scripts/{script_id}/request-publish
    - post /api/scripts/{script_id}/approve-publish
    - post /api/scripts/{script_id}/reject-publish
  Auditions & Stage Bookings:
    - get /api/audition-positions
    - post /api/audition-positions/create
    - get /api/audition-applications
    - post /api/audition-applications/{app_id}/status
    - get /api/my-auditions
    - post /api/audition/submit
    - get /api/stage-bookings
    - post /api/stage-bookings
  Proposals & Sponsorships:
    - get /api/proposals
    - post /api/proposals
    - post /api/proposals/{prop_id}/approve
    - post /api/proposals/{prop_id}/reject
    - post /api/proposals/{prop_id}/update
    - get /api/sponsor-ads
    - post /api/sponsor-ads/create
    - post /api/sponsor-ads/{ad_id}/status
  Gallery & Media:
    - get /api/gallery
    - post /api/gallery
    - delete /api/gallery/{item_id}
    - post /api/gallery/{item_id}/status
  Financials:
    - get /api/financials
    - get /api/financials/summary
    - get /api/revenue-metrics
    - post /api/revenue-metrics
  User Schedule & Notifications:
    - get /api/my-schedule
    - post /api/my-schedule/update
    - get /api/notifications
    - post /api/notifications/mark-read
  Maintainer & Governance:
    - get /api/maintainer/dashboard
    - get /api/maintainer/stats
  Frontend Navigation Routes:
    - get /
    - get /member/calendar
    - get /member/rehearsal
    - get /ai-rehearsal
    - get /script-directory
    - get /member/schedule
  System:
    - get /api/health

paths:
  /:
    get:
      tags:
        - Frontend Navigation Routes
      summary: Root Landing Page
      description: Serves the primary landing page interface for Aayam platform.
      operationId: get_root_landing_page_get
      security: []
      responses:
        '200':
          description: Successful HTML page load or index status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: active
                  message:
                    type: string
                    example: Aayam Cultural Club Platform API

  /member/calendar:
    get:
      tags:
        - Frontend Navigation Routes
      summary: Member Rehearsal & Event Calendar View
      operationId: get_member_calendar_view_get
      responses:
        '200':
          description: Calendar interface rendered successfully

  /member/rehearsal:
    get:
      tags:
        - Frontend Navigation Routes
      summary: Rehearsal Management Workspace
      operationId: get_member_rehearsal_view_get
      responses:
        '200':
          description: Rehearsal workspace rendered successfully

  /ai-rehearsal:
    get:
      tags:
        - Frontend Navigation Routes
      summary: AI Smart Rehearsal Workspace
      operationId: get_ai_rehearsal_view_get
      responses:
        '200':
          description: AI rehearsal interface rendered successfully

  /script-directory:
    get:
      tags:
        - Frontend Navigation Routes
      summary: Public Script Directory View
      operationId: get_script_directory_view_get
      security: []
      responses:
        '200':
          description: Script directory view rendered successfully

  /member/schedule:
    get:
      tags:
        - Frontend Navigation Routes
      summary: Member Personal Schedule View
      operationId: get_member_schedule_view_get
      responses:
        '200':
          description: Member schedule view rendered successfully

  /scripts:
    get:
      tags:
        - Rehearsals & Scripts
      summary: Search and Filter Scripts
      description: Search scripts by title/author or filter by genre (e.g. Street Play, Stage Drama).
      operationId: get_scripts_search_scripts_get
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term for title or playwright
        - name: genre
          in: query
          required: false
          schema:
            type: string
          description: Filter by script genre
      responses:
        '200':
          description: List of matching scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Script'
        '400':
          description: Invalid genre filter parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags:
        - Rehearsals & Scripts
      summary: Quick Create or Upload Script (Non-prefixed route)
      operationId: post_scripts_create_scripts_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptCreate'
      responses:
        '200':
          description: Script created successfully
        '201':
          description: Script created successfully
        '400':
          description: Validation error

  /rehearsal/start:
    post:
      tags:
        - Rehearsals & Scripts
      summary: Start Live Rehearsal Session
      operationId: start_rehearsal_rehearsal_start_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - script_id
              properties:
                script_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Rehearsal session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  script:
                    $ref: '#/components/schemas/Script'
        '400':
          description: Missing script_id
        '404':
          description: Script not found

  /script/pin:
    post:
      tags:
        - Rehearsals & Scripts
      summary: Pin Script to Favorites / Active Rehearsal List
      operationId: pin_script_script_pin_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - script_id
              properties:
                script_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Script pinned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pinned:
                    type: boolean
                    example: true
                  script:
                    $ref: '#/components/schemas/Script'
        '400':
          description: Missing script_id
        '404':
          description: Script not found

  /api/health:
    get:
      tags:
        - System
      summary: Platform Health Check
      description: Returns health status of SQLite database and Redis server connection.
      operationId: health_check_api_health_get
      security: []
      responses:
        '200':
          description: System healthy status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  database:
                    type: string
                    example: SQLite
                  redis_connected:
                    type: boolean
                    example: true

  /api/join:
    post:
      tags:
        - Authentication
      summary: Self-service Member Application & Sign-up
      description: Submits new member application with portfolio, interest area, and emergency contacts.
      operationId: join_club_api_join_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJoin'
      responses:
        '200':
          description: Application processed
        '201':
          description: Member registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  member:
                    $ref: '#/components/schemas/User'
                  generated_credentials:
                    type: object
                    properties:
                      email:
                        type: string
                      password:
                        type: string
        '400':
          description: Missing required fields or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/login:
    post:
      tags:
        - Authentication
      summary: Authenticate User & Issue JWT Session Token
      operationId: login_api_login_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/email or password
        '401':
          description: Invalid credentials
        '403':
          description: Account pending review
        '404':
          description: User not found

  /api/logout:
    post:
      tags:
        - Authentication
      summary: Terminate User Session & Revoke Token
      operationId: logout_api_logout_post
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token missing

  /api/members:
    get:
      tags:
        - User Profile & Directory
      summary: List Club Members Directory
      operationId: get_members_api_members_get
      responses:
        '200':
          description: List of registered members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/profile/get:
    get:
      tags:
        - User Profile & Directory
      summary: Get User Profile Details
      operationId: get_profile_api_profile_get_get
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Email address of user profile
      responses:
        '200':
          description: User profile payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Missing email parameter
        '404':
          description: User not found

  /api/profile/update:
    post:
      tags:
        - User Profile & Directory
      summary: Update User Profile Details
      operationId: update_profile_api_profile_update_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Missing email or invalid fields
        '404':
          description: User not found

  /api/events:
    get:
      tags:
        - Events & Plays
      summary: List Club Events
      operationId: get_events_api_events_get
      security: []
      responses:
        '200':
          description: List of upcoming and past events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /api/events/create:
    post:
      tags:
        - Events & Plays
      summary: Create New Production Event
      operationId: create_event_api_events_create_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '200':
          description: Event created successfully
        '201':
          description: Event created successfully
        '500':
          description: Server database error

  /api/events/{event_id}/update:
    post:
      tags:
        - Events & Plays
      summary: Update Event Details
      operationId: update_event_api_events__event_id__update_post
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Event updated successfully
        '404':
          description: Event not found

  /api/plays:
    get:
      tags:
        - Events & Plays
      summary: List Production Plays
      operationId: get_plays_api_plays_get
      security: []
      responses:
        '200':
          description: List of plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Play'

  /api/plays/{play_id}:
    get:
      tags:
        - Events & Plays
      summary: Get Single Play Details
      operationId: get_play_api_plays__play_id__get
      security: []
      parameters:
        - name: play_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detailed play information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Play'
        '404':
          description: Play not found

  /api/open-positions:
    get:
      tags:
        - Events & Plays
      summary: List Open Audition & Production Crew Positions
      operationId: get_open_positions_api_open_positions_get
      security: []
      responses:
        '200':
          description: List of open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditionPosition'

  /api/maintainer/dashboard:
    get:
      tags:
        - Maintainer & Governance
      summary: Maintainer Dashboard Overview
      operationId: get_maintainer_dashboard_api_maintainer_dashboard_get
      responses:
        '200':
          description: Dashboard stats and operational indicators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintainerDashboard'

  /api/maintainer/stats:
    get:
      tags:
        - Maintainer & Governance
      summary: System & Member Governance Statistics
      operationId: get_maintainer_stats_api_maintainer_stats_get
      responses:
        '200':
