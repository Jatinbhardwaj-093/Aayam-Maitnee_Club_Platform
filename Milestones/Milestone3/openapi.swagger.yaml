components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          tokenUrl: /api/login
          scopes: {}

  schemas:
    UserJoin:
      type: object
      required:
        - name
        - phone
        - state
        - country
        - pronouns
        - interest
        - availability
        - bio
        - emergencyName
        - emergencyPhone
      properties:
        name:
          type: string
          example: Jatin Bhardwaj
        phone:
          type: string
          example: "+919876543210"
        state:
          type: string
          example: Tamil Nadu
        country:
          type: string
          example: India
        pronouns:
          type: string
          example: He/Him
        interest:
          type: string
          example: Acting & Scriptwriting
        availability:
          type: string
          example: Weekends
        bio:
          type: string
          example: Drama enthusiast interested in street plays.
        emergencyName:
          type: string
          example: Parent Name
        emergencyPhone:
          type: string
          example: "+919876543211"
        portfolio:
          type: string
          example: https://github.com/jatinbhardwaj

    UserLogin:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: jatin@handle.com
        password:
          type: string
          example: jatin123

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jatin Bhardwaj
        email:
          type: string
          example: jatin@handle.com
        role:
          type: string
          example: Member
        initials:
          type: string
          example: JB
        isAdmin:
          type: boolean
          example: false

    UserProfileUpdate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          example: jatin@handle.com
        name:
          type: string
        phone:
          type: string
        bio:
          type: string
        availability:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        member_id:
          type: string
          example: MC-4921
        name:
          type: string
          example: Jatin Bhardwaj
        email:
          type: string
          example: jatin@handle.com
        phone:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        status:
          type: string
          example: Active
        interest:
          type: string

    Event:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Annual Cultural Nite
        description:
          type: string
        category:
          type: string
          example: Stage Play
        venue:
          type: string
          example: Main Auditorium
        date:
          type: string
          example: Aug 15, 2026
        status:
          type: string
          example: upcoming
        timeRange:
          type: string
          example: 18:00 - 21:00
        capacity:
          type: string

    EventCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Street Play Workshop
        description:
          type: string
        category:
          type: string
        venue:
          type: string
        event_date:
          type: string
          format: date

    EventUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        venue:
          type: string
        status:
          type: string

    Play:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Tamashbin
        genre:
          type: string
          example: Street Play
        playwright:
          type: string
        description:
          type: string

    AuditionPosition:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Lead Actor - Male
        play_title:
          type: string
          example: Tamashbin
        status:
          type: string
          example: Open

    AuditionPositionCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        play_title:
          type: string
        description:
          type: string

    AuditionApplication:
      type: object
      properties:
        id:
          type: integer
          example: 1
        applicant_name:
          type: string
        position_title:
          type: string
        status:
          type: string
          example: Pending

    StageBooking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        room_name:
          type: string
          example: Rehearsal Room A
        booker_name:
          type: string
        date:
          type: string
        time_slot:
          type: string
        status:
          type: string

    StageBookingCreate:
      type: object
      required:
        - room_name
        - date
        - time_slot
      properties:
        room_name:
          type: string
        date:
          type: string
        time_slot:
          type: string

    Script:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Tamashbin
        playwright:
          type: string
          example: Jatin Bhardwaj
        genre:
          type: string
          example: Street Play
        language:
          type: string
          example: Hindi & English
        acts:
          type: string
          example: 1 Act
        pages:
          type: integer
          example: 30
        author_email:
          type: string
        status:
          type: string
          example: Public

    ScriptCreate:
      type: object
      required:
        - title
        - author_email
      properties:
        title:
          type: string
        author_email:
          type: string
        playwright:
          type: string
        genre:
          type: string
        language:
          type: string
        acts:
          type: string
        pages:
          type: integer
        excerpt:
          type: string
        content:
          type: string
        status:
          type: string

    ScriptUpdate:
      type: object
      properties:
        title:
          type: string
        playwright:
          type: string
        genre:
          type: string
        status:
          type: string
        content:
          type: string

    Proposal:
      type: object
      properties:
        id:
          type: integer
          example: 1
