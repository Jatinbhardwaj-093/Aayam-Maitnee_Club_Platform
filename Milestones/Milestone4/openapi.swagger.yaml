          description: Position not found
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          tokenUrl: /api/login
          scopes: {}
  schemas:
    UserJoin:
      type: object
      required:
      - name
      - phone
      - state
      - country
      - pronouns
      - interest
      - availability
      - bio
      - emergencyName
      - emergencyPhone
      properties:
        name:
          type: string
          example: Jatin Bhardwaj
        phone:
          type: string
          example: '+919876543210'
        state:
          type: string
          example: Tamil Nadu
        country:
          type: string
          example: India
        pronouns:
          type: string
          example: He/Him
        interest:
          type: string
          example: Acting & Scriptwriting
        availability:
          type: string
          example: Weekends
        bio:
          type: string
          example: Drama enthusiast interested in street plays.
        emergencyName:
          type: string
          example: Parent Name
        emergencyPhone:
          type: string
          example: '+919876543211'
        portfolio:
          type: string
          example: https://github.com/jatinbhardwaj
    UserLogin:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: jatin@handle.com
        password:
          type: string
          example: jatin123
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jatin Bhardwaj
        email:
          type: string
          example: jatin@handle.com
        role:
          type: string
          example: Member
        initials:
          type: string
          example: JB
        isAdmin:
          type: boolean
          example: false
    UserProfileUpdate:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          example: jatin@handle.com
        name:
          type: string
        phone:
          type: string
        bio:
          type: string
        availability:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
