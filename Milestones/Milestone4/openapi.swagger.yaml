        schema:
          type: string
      responses:
        '200':
          description: Text/event-stream real-time connection
  /api/ai/portfolio_scan:
    post:
      summary: AI portfolio scanner matching applicant resume against role requirements
      operationId: ai_portfolio_scan_api_ai_portfolio_scan_post
      tags:
      - AI Audition Intelligence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: integer
                position_id:
                  type: integer
                user_email:
                  type: string
      responses:
        '200':
          description: Match analysis breakdown, score, and key strengths/gaps
        '404':
          description: Application or position not found
  /upload_audition:
    post:
      summary: Upload video audition for AI performance & posture analysis
      operationId: upload_audition_upload_audition_post
      tags:
      - AI Audition Intelligence
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: AI analysis performance report
  /api/events/extract-keywords:
    post:
      summary: AI keyword extraction from event description
      operationId: extract_event_keywords_api_events_extract_keywords_post
      tags:
      - AI Event Intelligence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
              required:
              - description
      responses:
        '200':
          description: List of extracted event keywords
        '400':
          description: Description required
        '503':
          description: AI service unavailable
  /api/events/autofill-proposal:
    post:
      summary: AI proposal form autofill from raw pitch paragraph
      operationId: autofill_event_proposal_api_events_autofill_proposal_post
      tags:
