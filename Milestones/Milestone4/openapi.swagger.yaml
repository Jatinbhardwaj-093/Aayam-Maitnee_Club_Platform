      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: AI turn payload containing synthesized text, emotion, tone, and voice data
        '404':
          description: Rehearsal session not found
  /api/rehearsal/roleplay/{session_id}/ai-complete:
    post:
      summary: Signal completion of AI audio playback and transition back to human actor turn
      operationId: complete_roleplay_ai_turn_api_rehearsal_roleplay__session_id__ai_complete_post
      tags:
      - Rehearsals & AI Roleplay
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session state transitioned to next speaker turn
        '404':
          description: Rehearsal session not found
  /api/rehearsal/roleplay/{session_id}/advance:
    post:
      summary: Force advance scene state to next turn
      operationId: advance_roleplay_turn_api_rehearsal_roleplay__session_id__advance_post
      tags:
      - Rehearsals & AI Roleplay
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Advanced session state
        '404':
          description: Session not found
  /api/rehearsal/roleplay/{session_id}/stop:
    post:
      summary: Terminate active roleplay session
      operationId: stop_roleplay_rehearsal_api_rehearsal_roleplay__session_id__stop_post
      tags:
      - Rehearsals & AI Roleplay
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Terminated session state
        '404':
          description: Session not found
  /api/rehearsal/scripts:
    get:
      summary: Get user-accessible rehearsal scripts with character counts and dialogue metrics
      operationId: get_rehearsal_scripts_api_rehearsal_scripts_get
      tags:
      - Rehearsals & AI Roleplay
      parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of rehearsal-ready script summaries
  /api/characters:
    get:
      summary: List extracted characters repository
      operationId: get_characters_api_characters_get
      tags:
      - AI Character Intelligence
      responses:
        '200':
          description: List of extracted characters
    post:
      summary: Create or update extracted character profile
      operationId: save_character_api_characters_post
      tags:
      - AI Character Intelligence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                traits:
                  type: array
                  items:
                    type: string
                motivation:
                  type: string
                role:
                  type: string
              required:
              - name
      responses:
        '200':
          description: Saved character object
        '400':
          description: Missing character name
    delete:
      summary: Delete extracted character by ID
      operationId: delete_character_api_characters_delete
      tags:
      - AI Character Intelligence
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Character successfully deleted
        '400':
          description: Character ID required
        '404':
          description: Character not found
  /api/suggest-character:
    post:
      summary: Generate character outline using AI model from prompt and context
      operationId: suggest_character_api_suggest_character_post
      tags:
      - AI Character Intelligence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                context:
                  type: string
              required:
              - prompt
      responses:
        '200':
          description: Generated character schema with name, description, traits, motivation, role
        '400':
          description: Prompt required
        '500':
          description: AI model completion error
  /api/analyze-text:
    post:
      summary: Analyze story text to extract characters and push SSE event update
      operationId: analyze_text_api_analyze_text_post
      tags:
      - AI Character Intelligence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                script_id:
                  type: string
      responses:
        '200':
          description: Extracted character list
  /api/auto-extract:
    post:
      summary: Normalize story text into screenplay dialogue and persist extracted characters
      operationId: auto_extract_api_auto_extract_post
      tags:
      - AI Character Intelligence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                script_id:
                  type: integer
              required:
              - text
      responses:
        '200':
          description: Normalized dialogue script and saved character objects
        '400':
          description: Text required
        '500':
          description: AI model processing failure
  /api/stream:
    get:
      summary: SSE EventSource stream for real-time character analysis events
      operationId: stream_events_api_stream_get
      tags:
      - AI Character Intelligence
      parameters:
      - name: script_id
        in: query
